# 持仓产品管理表 Schema
table_type: holding
encoding: auto  # chardet 自动检测，样本文件为 GB18030
join_keys:
  to_nav: 产品名称
  to_rating_entity: 限额占用方主体
  to_rating_bond: 资产代码

core_fields:
  - name: 持仓日期
    type: date
    desc: 数据日期
  - name: 产品名称
    type: str
    desc: 理财产品名称，关联净值表
  - name: 资产代码
    type: str
    desc: 债券/资产唯一代码
  - name: 资产名称
    type: str
    desc: 债券/资产名称
  - name: 资产市值_穿透后
    type: float
    desc: 穿透后市值（原始含千分位逗号，加载时处理）
    quote: true  # SQL中需用双引号包裹
  - name: 资产市值_半穿透
    type: float
    desc: 半穿透市值
    quote: true
  - name: 外部评级
    type: str
    desc: 外部信用评级，值：AAA/AA+/AA/AA-等
  - name: G06一级分类
    type: str
    desc: 资产大类（债券/现金/同业存单等）
  - name: 剩余期限
    type: float
    desc: 剩余到期期限（年），用于期限分层
  - name: 限额占用方主体
    type: str
    desc: 对应信用主体名称，关联主体评级表
  - name: 到期日
    type: date
    desc: 债券到期日期
