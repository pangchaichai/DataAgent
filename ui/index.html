<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DataAgent</title>
<link rel="stylesheet" href="/static/tailwind-local.css">
<style>
/* ══════════════════════════════════════════════════════════════
   Phase R3 UI — 全本地 · 状态透明 · 确认不可忽略
   设计权威: docs/refacter/ui-design.md
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg-base:#F8F9FA; --bg-sidebar:#FFFFFF; --bg-card:#FFFFFF; --bg-input:#FFFFFF;
  --bg-agent:#F0F4FF; --bg-code:#F1F5F9; --bg-hover:#F1F5F9;
  --border:#E2E8F0; --border-focus:#3B82F6;
  --text-primary:#0F172A; --text-secondary:#64748B; --text-muted:#94A3B8;
  --blue:#3B82F6; --blue-bg:#EFF6FF; --indigo:#6361F1;
  --success:#10B981; --success-bg:#ECFDF5; --warning:#F59E0B; --warning-bg:#FFFBEB;
  --error:#EF4444; --error-bg:#FEF2F2; --neutral:#6B7280;
  --radius:8px; --radius-lg:12px;
}
[data-theme="dark"]{
  --bg-base:#0F172A; --bg-sidebar:#1E293B; --bg-card:#1E293B; --bg-input:#1E293B;
  --bg-agent:#1E2D4A; --bg-code:#0F172A; --bg-hover:#334155; --border:#334155;
  --text-primary:#F1F5F9; --text-secondary:#94A3B8; --text-muted:#64748B;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;line-height:1.6;color:var(--text-primary);background:var(--bg-base);
  height:100vh;overflow:hidden;-webkit-user-select:text;user-select:text;}
.numeric{font-variant-numeric:tabular-nums;}
code,pre{font-family:"JetBrains Mono","Cascadia Code",monospace;font-size:13px;}

.app{display:grid;grid-template-rows:52px 1fr;height:100vh;}
/* Header */
.header{display:flex;align-items:center;gap:8px;padding:0 16px;
  background:var(--bg-sidebar);border-bottom:1px solid var(--border);z-index:10;}
.logo{font-weight:700;font-size:16px;margin-right:auto;white-space:nowrap;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  font-size:12px;background:var(--bg-hover);color:var(--text-secondary);cursor:pointer;
  border:none;white-space:nowrap;}
.chip:hover{background:var(--border);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot.on{background:var(--success);}.dot.warn{background:var(--warning);}.dot.off{background:var(--error);}
.iconbtn{background:none;border:none;cursor:pointer;font-size:16px;color:var(--text-secondary);padding:4px 6px;}

/* Body */
.body{display:grid;grid-template-columns:240px 1fr;overflow:hidden;}
.sidebar{background:var(--bg-sidebar);border-right:1px solid var(--border);
  overflow-y:auto;padding:12px;}
.sec{margin-bottom:18px;}
.sec-h{display:flex;align-items:center;font-size:11px;letter-spacing:.5px;
  color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;}
.sec-h .act{margin-left:auto;color:var(--blue);cursor:pointer;text-transform:none;
  letter-spacing:0;font-size:11px;}
.item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;
  font-size:13px;color:var(--text-primary);cursor:pointer;}
.item:hover{background:var(--bg-hover);}
.item .meta{margin-left:auto;font-size:11px;color:var(--text-muted);}
.item.active{background:var(--blue-bg);}
.tag{font-size:10px;padding:1px 7px;border-radius:8px;margin-left:auto;}
.tag.fixed{background:var(--blue-bg);color:var(--blue);}
.tag.exp{background:var(--bg-hover);color:var(--text-secondary);}

/* Main chat */
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg-base);}
.subhead{display:flex;align-items:center;padding:10px 20px;
  border-bottom:1px solid var(--border);font-size:13px;color:var(--text-secondary);}
.subhead .new{margin-left:auto;border:1px solid var(--border);background:var(--bg-card);
  color:var(--blue);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:12px;}
.subhead .new:hover{background:var(--blue-bg);}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
.chat .welcome{text-align:center;color:var(--text-muted);margin-top:60px;font-size:15px;}
.chat .welcome b{color:var(--text-primary);}

/* Messages */
.row{display:flex;gap:10px;}
.row.user{justify-content:flex-end;}
.bubble{max-width:78%;padding:10px 14px;border-radius:12px;font-size:13.5px;
  line-height:1.7;word-wrap:break-word;}
.bubble.user{background:var(--bg-hover);color:var(--text-primary);}
.bubble.agent{background:var(--bg-agent);color:var(--text-primary);}
.bubble pre{background:var(--bg-code);padding:8px 10px;border-radius:6px;
  overflow-x:auto;font-size:12.5px;margin:6px 0;}
.bubble code{background:var(--bg-code);padding:1px 5px;border-radius:4px;font-size:12.5px;}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--indigo);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.thinking{background:var(--bg-agent);border-radius:8px;padding:8px 12px;
  font-size:12.5px;color:var(--text-secondary);cursor:pointer;
  border-left:3px solid var(--indigo);}
.thinking .expand{float:right;color:var(--text-muted);font-size:11px;}
.thinking .steps{display:none;margin-top:6px;font-size:12px;}
.thinking.open .steps{display:block;}

/* Tool cards */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;font-size:13px;}
.card.ok{border-color:var(--success);background:var(--success-bg);}
.card.err{border-color:var(--error);background:var(--error-bg);}
.card.running{border-color:var(--blue);background:var(--blue-bg);}
.card .tool-h{display:flex;align-items:center;gap:8px;}
.card .tool-h .st{margin-left:auto;font-size:12px;}
.card .muted{color:var(--text-secondary);font-size:11.5px;margin-top:4px;}
.card .sql-block{display:none;margin-top:8px;}
.card .sql-block.open{display:block;}
.st.green{color:var(--success);}.st.red{color:var(--error);}.st.blue{color:var(--blue);}

/* Tables */
.data-table-wrap{overflow-x:auto;max-height:400px;overflow-y:auto;margin-top:6px;}
.data-table{border-collapse:collapse;width:100%;font-size:12.5px;}
.data-table th{text-align:left;color:var(--text-secondary);font-size:11px;
  text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--border);
  padding:6px 8px;position:sticky;top:0;background:var(--bg-card);cursor:pointer;}
.data-table th:hover{color:var(--blue);}
.data-table td{padding:6px 8px;border-bottom:1px solid var(--border);}
.data-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
.data-table tr:last-child td{font-weight:600;}
.csv-btn{font-size:11px;color:var(--blue);cursor:pointer;margin-top:4px;display:inline-block;}

/* Confirm / Ask */
.confirm{border-left:4px solid var(--blue);background:var(--blue-bg);
  border-radius:var(--radius-lg);padding:16px;}
.confirm h3{font-size:14px;margin-bottom:4px;}
.confirm .sub{font-size:12px;color:var(--text-secondary);margin-bottom:10px;}
.btn{border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;}
.btn.primary{background:var(--blue);color:#fff;}
.btn.primary:hover{opacity:.9;}
.btn.ghost{background:var(--bg-card);border:1px solid var(--border);
  color:var(--text-secondary);font-weight:400;}
.btn.ghost:hover{background:var(--bg-hover);}
.btn.opt{background:var(--bg-card);border:1px solid var(--blue);color:var(--blue);
  margin:4px 6px 0 0;}
.btn.opt:hover{background:var(--blue-bg);}
.link{color:var(--blue);font-size:12px;cursor:pointer;display:inline-block;margin:8px 0;}
.link:hover{text-decoration:underline;}
.status-ok{color:var(--success);}
.status-warn{color:var(--warning);}

/* Quality */
.quality{border-left:4px solid var(--warning);background:var(--warning-bg);
  border-radius:var(--radius-lg);padding:14px;}
.quality .q-row{font-size:12px;margin:3px 0;}

/* Input */
.inputbar{border-top:1px solid var(--border);padding:10px 20px 14px;
  background:var(--bg-sidebar);}
.quick{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.q{font-size:12px;padding:5px 12px;border-radius:16px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text-secondary);cursor:pointer;}
.q:hover{border-color:var(--blue);color:var(--blue);}
.inrow{display:flex;gap:10px;}
textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;font-size:13.5px;background:var(--bg-input);
  color:var(--text-primary);font-family:inherit;-webkit-user-select:text;user-select:text;}
textarea:focus{outline:none;border-color:var(--blue);}
.send{padding:0 22px;border:none;border-radius:10px;background:var(--blue);color:#fff;
  font-weight:600;cursor:pointer;}
.send:hover{opacity:.9;}
.disabled{opacity:.55;pointer-events:none;}
.hintbar{font-size:12px;color:var(--warning);margin-bottom:6px;display:none;}
.hintbar.show{display:block;}
.dragover{border:2px dashed var(--blue)!important;}
</style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <div class="header">
    <span class="logo">📊 DataAgent</span>
    <span class="chip" id="llmChip"><span class="dot on"></span> <span id="llmName">--</span></span>
    <span class="chip">💾 <span id="ramMb">--</span>MB</span>
    <span class="chip"><span id="tokenUsed">0</span> / <span id="tokenLimit">64K</span></span>
    <button class="iconbtn" onclick="toggleTheme()" title="切换主题">🌙</button>
    <button class="iconbtn" onclick="resetChat()" title="新对话">＋</button>
  </div>

  <!-- BODY -->
  <div class="body">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sec">
        <div class="sec-h">💬 最近会话 <span class="act" onclick="loadSessions()">刷新</span></div>
        <div id="sessionList"><div class="item" style="color:var(--text-muted)">加载中…</div></div>
      </div>
      <div class="sec">
        <div class="sec-h">📂 已加载数据 <span class="act" id="uploadLink">＋上传</span></div>
        <div id="tableList"><div class="item" style="color:var(--text-muted)">暂无数据</div></div>
      </div>
      <div class="sec">
        <div class="sec-h">🔖 Skills</div>
        <div id="skillList"><div class="item" style="color:var(--text-muted)">加载中…</div></div>
      </div>
      <div class="sec">
        <div class="sec-h">👥 集团系</div>
        <div id="groupList"><div class="item" style="color:var(--text-muted)">加载中…</div></div>
      </div>
    </aside>

    <!-- MAIN CHAT -->
    <main class="main">
      <div class="subhead">
        <span id="chatTitle">新对话</span>
        <button class="new" onclick="resetChat()">＋ 新对话</button>
      </div>
      <div class="chat" id="chat">
        <div class="welcome">
          <b>👋 你好，我是 DataAgent</b><br>
          上传数据文件后用中文提问即可<br>
          <span style="font-size:13px;">合规/报告数字我会用固化口径计算并请你确认</span>
        </div>
      </div>
      <div class="inputbar">
        <div class="hintbar" id="hint">⏸ 请先在上方完成确认或选择后再继续输入</div>
        <div class="quick">
          <button class="q" onclick="sendQuick('/tables')">/tables</button>
          <button class="q" onclick="sendQuick('/skills')">/skills</button>
          <button class="q" onclick="sendQuick('/health')">/health</button>
          <button class="q" onclick="resetChat()">🧹 清空</button>
        </div>
        <div class="inrow" id="inrow">
          <textarea id="input" rows="2"
            placeholder="输入分析需求… Enter 发送 / Shift+Enter 换行"
            onkeydown="onInputKey(event)"></textarea>
          <button class="send" id="sendBtn" onclick="sendMessage()">发送 ↵</button>
        </div>
        <input type="file" id="fileInput" style="display:none" accept=".csv,.xlsx,.xls"
          onchange="uploadFile(this.files[0])" multiple/>
      </div>
    </main>
  </div>
</div>

<script>
// ============ STATE ============
const ST = { streamId: null, locked: false, currentSessionId: '', pendingCharts: [] };

// ============ DOM ============
const C=id=>document.getElementById(id);
const chat=C('chat');
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;}
function add(n){chat.appendChild(n);chat.scrollTop=chat.scrollHeight;return n;}
function clearChat(){chat.innerHTML='';}

// ============ API ============
async function api(method, path, body){
  const opts={method,headers:{}};
  if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
  const r=await fetch(path,opts);
  return r.json();
}

async function uploadFile(file){
  if(!file)return;
  const fd=new FormData();
  fd.append('file',file);
  fd.append('table_type',guessType(file.name));
  try{
    const r=await fetch('/api/upload',{method:'POST',body:fd});
    const d=await r.json();
    if(d.ok){
      addMsg('agent',`✅ 已加载：<b>${escHtml(d.table_name)}</b>（${file.name}）`);
      if(d.quality_report) renderQualityCard(d.quality_report, d.table_name);
      refreshSidebar();
    } else {
      addMsg('agent',`❌ 上传失败：${escHtml(d.error)}`);
    }
  }catch(e){addMsg('agent',`❌ 上传异常：${e.message}`);}
}

function guessType(fn){
  const n=fn.toLowerCase();
  if(n.includes('持仓')||n.includes('holding'))return'holding';
  if(n.includes('净值')||n.includes('nav'))return'nav';
  if(n.includes('评级')&&n.includes('主体'))return'rating_entity';
  if(n.includes('评级')&&n.includes('债券'))return'rating_bond';
  if(n.includes('监控'))return'monitoring';
  if(n.includes('周报'))return'weekly_report';
  return'unknown';
}

// ============ SESSION ============
async function loadSessions(){
  try{
    const d=await api('GET','/api/sessions');
    const s=d.sessions||[];
    const list=C('sessionList');
    if(!s.length){list.innerHTML='<div class="item" style="color:var(--text-muted)">暂无历史会话</div>';return;}
    list.innerHTML=s.slice(0,10).map(sess=>{
      const active=sess.id===ST.currentSessionId;
      const dot=active?'<span style="color:var(--success)">●</span>':'<span style="color:var(--text-muted)">○</span>';
      return `<div class="item${active?' active':''}" onclick="loadSession('${sess.id}')">
        ${dot} ${escHtml(sess.title||'未命名')} <span class="meta">${(sess.updated_at||'').slice(5,16)}</span></div>`;
    }).join('');
    list.innerHTML+='<div class="item" style="color:var(--blue);font-size:12px;cursor:pointer" onclick="resetChat()">＋ 新对话</div>';
  }catch(e){}
}

async function loadSession(id){
  try{
    const d=await api('GET',`/api/sessions/${id}`);
    clearChat();
    ST.currentSessionId=id;
    C('chatTitle').textContent=d.title||'历史会话';
    (d.messages||[]).forEach(m=>{
      if(m.role==='user') addUserBubble(m.content);
      else if(m.role==='assistant') addAgentBubble(m.content);
    });
    addMsg('agent','<i>— 历史会话回放（只读）— <span class="link" onclick="continueChat()">在此会话继续</span></i>');
    refreshSidebar();
  }catch(e){addMsg('agent',`❌ 加载会话失败：${e.message}`);}
}

function continueChat(){
  addMsg('agent','已载入历史上下文，可以继续对话。');
}

// ============ SSE ============
async function sendMessage(){
  const input=C('input');
  const msg=input.value.trim();
  if(!msg||ST.locked)return;
  input.value='';
  addUserBubble(msg);
  C('chatTitle').textContent=msg.slice(0,40);
  if(chat.querySelector('.welcome'))clearChat();

  try{
    const r=await fetch('/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg}),
    });
    const d=await r.json();
    if(!d.ok){addMsg('agent',`❌ ${d.error}`);return;}
    ST.streamId=d.stream_id;

    const es=new EventSource(`/api/stream/${ST.streamId}`);
    es.onmessage=function(e){
      try{handleChunk(JSON.parse(e.data));}catch(ex){}
    };
    es.onerror=function(){es.close();ST.streamId=null;};
  }catch(e){addMsg('agent',`❌ 请求失败：${e.message}`);}
}

function handleChunk(chunk){
  const t=chunk.type, d=chunk.data;

  if(t==='text'){
    let last=chat.lastElementChild;
    if(last && last.classList.contains('row') && !last.classList.contains('user')
       && last.querySelector('.bubble.agent') && !last.querySelector('.card')){
      last.querySelector('.bubble.agent').innerHTML+=d;
    } else {addAgentBubble(d);}
  }
  else if(t==='thinking'){
    add(el(`<div class="row"><div style="width:28px"></div>
      <div class="thinking" onclick="this.classList.toggle('open')">
      ▸ ${escHtml(d)} <span class="expand"></span>
      </div></div>`));
  }
  else if(t==='tool_start'){
    const label=d.label||d.tool||'';
    add(el(`<div class="row"><div style="width:28px"></div>
      <div class="card running" style="flex:1" id="tool-${d.id}">
      <div class="tool-h">⚡ <b>${escHtml(d.tool||'')}</b> ${escHtml(label)}
      <span class="st blue">执行中…</span></div></div></div>`));
  }
  else if(t==='tool_end'){
    const card=C(`tool-${d.id}`);
    if(card){
      card.classList.remove('running');
      card.classList.add(d.success?'ok':'err');
      const st=card.querySelector('.st');
      if(st){
        st.className='st '+(d.success?'green':'red');
        st.textContent=d.success?(d.summary||'✅ 完成'):('❌ '+(d.summary||'失败'));
      }
      if(d.sql){
        card.innerHTML+=`<div class="muted"><span class="link" onclick="this.nextElementSibling.classList.toggle('open')">📋 查看 SQL</span>
          <pre class="sql-block">${escHtml(d.sql)}</pre></div>`;
      }
    }
  }
  else if(t==='table'){
    add(renderTable(d));
  }
  else if(t==='confirm'){
    ST.locked=true; lockInput(true);
    add(renderConfirmCard(d));
  }
  else if(t==='ask'){
    ST.locked=true; lockInput(true);
    add(renderAskCard(d));
  }
  else if(t==='error'){
    addMsg('agent',`❌ ${escHtml(d.message||d)}`);
  }
  else if(t==='stream_end'){
    ST.streamId=null;
    refreshSidebar();
    ST.pendingCharts.forEach(opt=>renderChart(opt));
    ST.pendingCharts=[];
  }
  else if(t==='chart'){
    ST.pendingCharts.push(d);
  }
}

// ============ RENDER ============
function addUserBubble(text){
  add(el(`<div class="row user"><div class="bubble user">${escHtml(text)}</div></div>`));
}

function addAgentBubble(html){
  add(el(`<div class="row"><div class="avatar">🤖</div><div class="bubble agent">${html}</div></div>`));
}

function addMsg(role,html){
  if(role==='user')addUserBubble(html);else addAgentBubble(html);
}

function renderTable(d){
  const cols=d.columns||[], rows=d.rows||[];
  let h=`<div class="card"><div class="tool-h"><b>📊 ${escHtml(d.title||'查询结果')}</b>
    <span class="st">${rows.length} 行</span></div>
    <div class="data-table-wrap"><table class="data-table">
    <thead><tr>${cols.map((c,i)=>`<th onclick="sortTable(this,${i})">${escHtml(c)}</th>`).join('')}</tr></thead>
    <tbody>`;
  rows.forEach(r=>{
    h+='<tr>';
    r.forEach(v=>{
      const isNum=typeof v==='number'||(typeof v==='string'&&!isNaN(parseFloat(v))&&isFinite(v));
      h+=`<td class="${isNum?'num':''}">${isNum?Number(v).toLocaleString():escHtml(String(v??''))}</td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  if(d.sql)h+=`<div class="muted"><span class="link" onclick="this.nextElementSibling.classList.toggle('open')">📋 SQL</span>
    <pre class="sql-block">${escHtml(d.sql)}</pre></div>`;
  h+=`<span class="csv-btn" onclick="exportCSV(this)">📥 导出 CSV</span></div>`;
  return el(h);
}

function renderConfirmCard(d){
  const title=d.title||'请确认';
  const summary=d.summary||[];
  let tbl='';
  if(summary.length){
    tbl='<div class="card" style="background:var(--bg-card);margin:8px 0"><table class="data-table">';
    tbl+='<tr><th>指标</th><th style="text-align:right">数值</th></tr>';
    summary.forEach(s=>{
      tbl+=`<tr><td>${escHtml(s.label||'')}</td><td class="num">${escHtml(String(s.value??''))}</td></tr>`;
    });
    tbl+='</table></div>';
  }
  return el(`<div class="row"><div style="width:28px"></div><div class="confirm" style="flex:1">
    <h3>⏸ ${escHtml(title)}</h3>
    <div class="sub">请确认以上数值与口径是否正确</div>${tbl}
    ${d.sql_or_formula?`<span class="link" onclick="this.nextElementSibling.classList.toggle('open')">📋 查看公式/SQL</span>
      <pre class="sql-block">${escHtml(d.sql_or_formula)}</pre>`:''}
    <button class="btn primary" onclick="doConfirm(true)">✅ 确认，继续</button>
    <button class="btn ghost" onclick="doConfirm(false)">❌ 取消</button>
  </div></div>`);
}

function renderAskCard(d){
  const q=d.question||'请选择';
  const opts=d.options||[];
  let btns=opts.map(o=>`<button class="btn opt" onclick="doAsk('${escHtml(o)}')">${escHtml(o)}</button>`).join('');
  return el(`<div class="row"><div style="width:28px"></div><div class="confirm" style="flex:1">
    <h3>❓ ${escHtml(q)}</h3>
    <div class="sub">为保证数字正确，请选择一个选项</div>${btns}
  </div></div>`);
}

function renderQualityCard(qr,tableName){
  const crit=qr.critical_issues||[];
  const warns=qr.warnings||[];
  let h=`<div class="quality"><b>📊 数据质量 · ${escHtml(tableName)}</b>`;
  if(crit.length){
    h+=`<div style="margin-top:6px;font-size:12.5px;color:var(--error)">⚠️ 需要注意（${crit.length}项）</div>`;
    crit.forEach(c=>h+=`<div class="q-row" style="color:var(--error)">• ${escHtml(c)}</div>`);
  }
  if(warns.length){
    warns.slice(0,5).forEach(w=>h+=`<div class="q-row muted">• ${escHtml(w)}</div>`);
  }
  if(!crit.length&&!warns.length){
    h+=`<div style="margin-top:6px;font-size:12.5px;color:var(--success)">✅ 数据质量正常</div>`;
  }
  h+='</div>';
  add(el(`<div class="row"><div style="width:28px"></div>${h}</div>`));
}

function renderChart(opt){
  if(typeof echarts==='undefined')return;
  const id='chart_'+Math.random().toString(36).slice(2,8);
  const c=add(el(`<div class="card"><div class="tool-h"><b>📈 ${escHtml(opt.title||'图表')}</b></div>
    <div id="${id}" style="width:100%;height:350px"></div></div>`));
  setTimeout(()=>{
    const dom=C(id);
    if(dom)echarts.init(dom).setOption(opt.option);
  },100);
}

// ============ ACTIONS ============
async function doConfirm(confirmed){
  ST.locked=false; lockInput(false);
  await api('POST','/api/confirm',{confirmed});
  if(!confirmed)addMsg('agent','已取消本次操作。可调整后重试。');
  else{
    const input=C('input');
    input.value='确认继续';
    sendMessage();
  }
}

function doAsk(choice){
  ST.locked=false; lockInput(false);
  C('input').value=choice;
  sendMessage();
}

async function sendQuick(cmd){
  C('input').value=cmd;
  sendMessage();
}

function lockInput(lock){
  C('inrow').classList.toggle('disabled',lock);
  C('hint').classList.toggle('show',lock);
}

function sortTable(th,colIdx){
  const table=th.closest('table');
  const tbody=table.querySelector('tbody');
  const rows=Array.from(tbody.querySelectorAll('tr'));
  const asc=th.dataset.sort!=='asc';
  rows.sort((a,b)=>{
    const va=a.children[colIdx]?.textContent||'';
    const vb=b.children[colIdx]?.textContent||'';
    const na=parseFloat(va),nb=parseFloat(vb);
    if(!isNaN(na)&&!isNaN(nb))return asc?na-nb:nb-na;
    return asc?va.localeCompare(vb):vb.localeCompare(va);
  });
  th.dataset.sort=asc?'asc':'desc';
  rows.forEach(r=>tbody.appendChild(r));
}

function exportCSV(btn){
  const card=btn.closest('.card');
  const table=card.querySelector('table');
  if(!table)return;
  let csv='';
  table.querySelectorAll('tr').forEach(r=>{
    const cells=[];
    r.querySelectorAll('th,td').forEach(c=>cells.push('"'+c.textContent.replace(/"/g,'""')+'"'));
    csv+=cells.join(',')+'\n';
  });
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='export.csv';
  a.click();
}

// ============ SIDEBAR ============
async function refreshSidebar(){
  loadSessions(); loadTables(); loadSkills(); loadGroups();
}

async function loadTables(){
  try{
    const d=await api('GET','/api/tables');
    const tables=d.tables||[];
    const list=C('tableList');
    if(!tables.length){list.innerHTML='<div class="item" style="color:var(--text-muted)">暂无数据</div>';return;}
    list.innerHTML=tables.map(t=>{
      const dot=t.type==='holding'?'<span class="dot on"></span>':
                t.type==='nav'?'<span class="dot" style="background:var(--blue)"></span>':
                '<span class="dot" style="background:var(--neutral)"></span>';
      return `<div class="item">${dot} ${escHtml(t.name)} <span class="meta">${t.rows}行</span></div>`;
    }).join('');
    list.innerHTML+='<div class="item" style="color:var(--blue);font-size:12px" onclick="C(\'fileInput\').click()">＋ 上传文件</div>';
  }catch(e){}
}

async function loadSkills(){
  try{
    const d=await api('GET','/api/skills');
    const skills=d.skills||[];
    const list=C('skillList');
    if(!skills.length){list.innerHTML='<div class="item" style="color:var(--text-muted)">无可用技能</div>';return;}
    list.innerHTML=skills.map(s=>
      `<div class="item">${escHtml(s.name)} <span class="tag ${s.calc_type==='fixed'?'fixed':'exp'}">${s.calc_type==='fixed'?'固化':'探索'}</span></div>`
    ).join('');
  }catch(e){}
}

async function loadGroups(){
  try{
    const r=await fetch('/api/groups');
    if(!r.ok)return;
    const d=await r.json();
    const groups=d.groups||{};
    const list=C('groupList');
    const entries=Object.entries(groups);
    if(!entries.length){list.innerHTML='<div class="item" style="color:var(--text-muted)">暂无集团系</div>';return;}
    list.innerHTML=entries.map(([k,v])=>
      `<div class="item">${escHtml(k)} <span class="meta">${v.length}主体</span></div>`
    ).join('');
  }catch(e){}
}

// ============ INPUT ============
function onInputKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
}

function resetChat(){
  ST.locked=false; lockInput(false);
  clearChat();
  add(el(`<div class="welcome">
    <b>👋 你好，我是 DataAgent</b><br>
    上传数据文件后用中文提问即可<br>
    <span style="font-size:13px;">合规/报告数字我会用固化口径计算并请你确认</span>
  </div>`));
  api('POST','/api/reset');
  C('chatTitle').textContent='新对话';
  ST.currentSessionId='';
}

function toggleTheme(){
  const h=document.documentElement;
  h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';
}

// ============ DRAG & DROP ============
const ibar=document.querySelector('.inputbar');
ibar.addEventListener('dragover',e=>{e.preventDefault();ibar.classList.add('dragover');});
ibar.addEventListener('dragleave',()=>ibar.classList.remove('dragover'));
ibar.addEventListener('drop',e=>{
  e.preventDefault();ibar.classList.remove('dragover');
  for(const f of e.dataTransfer.files)uploadFile(f);
});
C('uploadLink').addEventListener('click',()=>C('fileInput').click());

// ============ HELPERS ============
function escHtml(s){
  if(s===null||s===undefined)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============ INIT ============
refreshSidebar();
setInterval(async()=>{
  try{
    const d=await api('GET','/api/health');
    C('ramMb').textContent=d.ram_mb||'--';
    C('tokenUsed').textContent=d.token_used||0;
    C('tokenLimit').textContent=Math.round((d.token_limit||64000)/1000)+'K';
    C('llmName').textContent=d.llm_name||'--';
  }catch(e){}
},15000);
</script>
