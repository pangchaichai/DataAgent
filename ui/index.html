<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DataAgent</title>
<script src="/static/echarts.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════
   DataAgent UI v2.0 — Claude Code 风格 · 进程折叠 · Markdown
   ═══════════════════════════════════════════════════════════ */
:root{
  --bg:#FAFBFC; --bg-s:#FFFFFF; --bg-agent:#F5F7FA; --bg-user:#E9EFFD;
  --bg-code:#F0F2F5; --bg-hover:#F0F2F5;
  --text:#1C2024; --text-2:#5C6370; --text-3:#8B929A;
  --blue:#2563EB; --blue-bg:#EFF6FF; --green:#16A34A; --green-bg:#F0FDF4;
  --red:#DC2626; --red-bg:#FEF2F2; --orange:#D97706; --orange-bg:#FFFBEB;
  --border:#E5E7EB; --radius:8px;
}
[data-theme="dark"]{
  --bg:#0D1117; --bg-s:#161B22; --bg-agent:#1C2128; --bg-user:#1C3257;
  --bg-code:#0D1117; --bg-hover:#21262D;
  --text:#C9D1D9; --text-2:#8B929A; --text-3:#484F58;
  --blue:#58A6FF; --blue-bg:#0D1117; --green:#3FB950; --green-bg:#0D1117;
  --red:#F85149; --red-bg:#0D1117; --orange:#D29922; --orange-bg:#0D1117;
  --border:#30363D;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;line-height:1.6;color:var(--text);background:var(--bg);
  -webkit-user-select:text;user-select:text;}
code,pre{font-family:"JetBrains Mono","Cascadia Code","Consolas",monospace;font-size:13px;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}

/* ── Layout ── */
.app{display:grid;grid-template-rows:48px 1fr;height:100%;overflow:hidden;}
.header{display:flex;align-items:center;gap:8px;padding:0 12px;
  background:var(--bg-s);border-bottom:1px solid var(--border);z-index:20;}
.logo{font-weight:700;font-size:15px;margin-right:auto;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.logo-icon{font-size:18px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:16px;
  font-size:12px;background:var(--bg-hover);color:var(--text-2);border:none;white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
.dot.on{background:var(--green);}.dot.warn{background:var(--orange);}.dot.off{background:var(--red);}
.iconbtn{background:none;border:none;cursor:pointer;font-size:15px;color:var(--text-2);
  padding:4px 8px;border-radius:6px;transition:background .15s;}
.iconbtn:hover{background:var(--bg-hover);}

.body-wrap{display:grid;grid-template-columns:250px 1fr;overflow:hidden;
  transition:grid-template-columns .2s ease;}
.body-wrap.collapsed{grid-template-columns:0px 1fr;}
.body-wrap.collapsed .sidebar{opacity:0;pointer-events:none;overflow:hidden;padding:0;border:none;}

/* ── Sidebar ── */
.sidebar{background:var(--bg-s);border-right:1px solid var(--border);
  overflow-y:auto;overflow-x:hidden;padding:12px;transition:opacity .2s;}
.sec{margin-bottom:16px;}
.sec-h{display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.4px;
  color:var(--text-3);text-transform:uppercase;margin-bottom:4px;padding:0 4px;}
.sec-h .act{margin-left:auto;color:var(--blue);cursor:pointer;text-transform:none;
  letter-spacing:0;font-size:11px;font-weight:400;}
.sec-h .act:hover{text-decoration:underline;}
.s-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;
  font-size:13px;color:var(--text);cursor:pointer;overflow:hidden;}
.s-item:hover{background:var(--bg-hover);}
.s-item.active{background:var(--blue-bg);color:var(--blue);}
.s-item .s-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.s-item .s-meta{flex-shrink:0;font-size:11px;color:var(--text-3);}
.s-tag{font-size:10px;padding:1px 6px;border-radius:8px;flex-shrink:0;}
.s-tag.fixed{background:var(--blue-bg);color:var(--blue);}
.s-tag.exp{background:var(--bg-hover);color:var(--text-2);}

/* ── Main ── */
.main{display:flex;flex-direction:column;overflow:hidden;min-height:0;background:var(--bg);}
.topbar{display:flex;align-items:center;padding:6px 20px;
  border-bottom:1px solid var(--border);font-size:13px;color:var(--text-2);flex-shrink:0;}
.topbar .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .new-btn{border:1px solid var(--border);background:var(--bg-s);color:var(--blue);
  padding:3px 12px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;}
.topbar .new-btn:hover{background:var(--blue-bg);}

.chat{flex:1 1 0;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;
  gap:6px;min-height:0;}

/* ── Welcome ── */
.welcome{text-align:center;color:var(--text-3);margin:auto;padding:40px 20px;}
.welcome h2{color:var(--text);font-size:18px;font-weight:600;margin-bottom:8px;}
.welcome p{font-size:14px;margin:4px 0;}
.welcome .sub{font-size:13px;color:var(--text-3);}

/* ── Messages ── */
.msg-row{display:flex;gap:10px;max-width:100%;}
.msg-row.user{justify-content:flex-end;}
.agent-avatar{width:26px;height:26px;border-radius:6px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:11px;font-weight:700;margin-top:2px;}
.bubble{max-width:min(78%,720px);padding:10px 14px;border-radius:10px;font-size:13.5px;
  line-height:1.7;word-wrap:break-word;overflow-wrap:break-word;}
.bubble.user{background:var(--bg-user);color:var(--text);border-radius:10px 10px 2px 10px;}
.bubble.agent{background:var(--bg-agent);color:var(--text);border-radius:10px 10px 10px 2px;}
.bubble.agent.streaming::after{content:'▊';color:var(--blue);animation:blink .7s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── Markdown inside bubbles ── */
.bubble.agent h3{font-size:15px;font-weight:600;margin:10px 0 4px;}
.bubble.agent h4{font-size:14px;font-weight:600;margin:8px 0 4px;}
.bubble.agent p{margin:4px 0;}
.bubble.agent strong{font-weight:600;}
.bubble.agent ul,.bubble.agent ol{padding-left:20px;margin:4px 0;}
.bubble.agent li{margin:2px 0;}
.bubble.agent blockquote{border-left:3px solid var(--border);padding-left:10px;
  color:var(--text-2);margin:6px 0;}
.bubble.agent pre{background:var(--bg-code);padding:10px 12px;border-radius:6px;
  overflow-x:auto;margin:6px 0;font-size:12.5px;line-height:1.5;border:1px solid var(--border);}
.bubble.agent code{background:var(--bg-code);padding:1px 5px;border-radius:3px;font-size:12.5px;}
.bubble.agent pre code{background:none;padding:0;border-radius:0;}
.bubble.agent a{color:var(--blue);text-decoration:none;}
.bubble.agent a:hover{text-decoration:underline;}
.bubble.agent .md-table-wrap{overflow-x:auto;margin:6px 0;}
.bubble.agent .md-table{border-collapse:collapse;width:100%;font-size:12.5px;}
.bubble.agent .md-table th{text-align:left;font-weight:600;border-bottom:2px solid var(--border);padding:4px 8px;}
.bubble.agent .md-table td{border-bottom:1px solid var(--border);padding:4px 8px;}

/* ── Process lines (Claude Code style) ── */
.proc-group{margin:2px 0 2px 36px;}
.proc-line{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:6px;
  font-size:12.5px;color:var(--text-2);cursor:pointer;transition:background .15s;
  border:1px solid transparent;}
.proc-line:hover{background:var(--bg-hover);border-color:var(--border);}
.proc-line .p-icon{width:14px;text-align:center;font-size:13px;flex-shrink:0;}
.proc-line .p-name{font-weight:500;color:var(--text);flex-shrink:0;}
.proc-line .p-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);}
.proc-line .p-st{flex-shrink:0;font-size:11.5px;font-weight:500;}
.p-st.running{color:var(--blue);}
.p-st.ok{color:var(--green);}
.p-st.err{color:var(--red);}
.proc-detail{display:none;padding:4px 10px 8px 32px;font-size:12px;color:var(--text-2);}
.proc-line.open+.proc-detail{display:block;}
.proc-detail pre{background:var(--bg-code);padding:8px 10px;border-radius:6px;
  overflow-x:auto;font-size:12px;margin:4px 0;border:1px solid var(--border);}

/* ── Data tables ── */
.table-card{background:var(--bg-s);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;margin:4px 0 4px 36px;max-width:min(96%, 800px);}
.table-card .tc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px;}
.table-card .tc-title{font-weight:600;color:var(--text);}
.table-card .tc-meta{color:var(--text-3);font-size:11.5px;margin-left:auto;}
.dt-wrap{overflow-x:auto;max-height:400px;overflow-y:auto;}
.dt{border-collapse:collapse;width:100%;font-size:12.5px;}
.dt th{text-align:left;color:var(--text-2);font-size:11px;font-weight:600;
  letter-spacing:.03em;border-bottom:2px solid var(--border);
  padding:5px 8px;position:sticky;top:0;background:var(--bg-s);cursor:pointer;}
.dt th:hover{color:var(--blue);}
.dt td{padding:5px 8px;border-bottom:1px solid var(--border);}
.dt td.num{text-align:right;font-variant-numeric:tabular-nums;}
.tc-actions{display:flex;gap:12px;margin-top:6px;}
.tc-link{font-size:11.5px;color:var(--blue);cursor:pointer;}
.tc-link:hover{text-decoration:underline;}

/* ── Confirm / Ask ── */
.action-card{border-left:4px solid var(--blue);background:var(--blue-bg);
  border-radius:var(--radius);padding:14px 16px;margin:6px 0 6px 36px;max-width:600px;}
.action-card h3{font-size:14px;font-weight:600;margin-bottom:4px;}
.action-card .sub{font-size:12px;color:var(--text-2);margin-bottom:10px;}
.action-card .summary-table{margin:8px 0;}
.action-card .summary-table td{padding:4px 8px;font-size:13px;}
.action-card .summary-table td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;}
.btn{border:none;border-radius:6px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;}
.btn.primary{background:var(--blue);color:#fff;}.btn.primary:hover{opacity:.9;}
.btn.ghost{background:var(--bg-s);border:1px solid var(--border);color:var(--text-2);font-weight:400;}
.btn.ghost:hover{background:var(--bg-hover);}
.btn.opt{background:var(--bg-s);border:1px solid var(--blue);color:var(--blue);margin:4px 6px 0 0;}
.btn.opt:hover{background:var(--blue-bg);}

/* ── Quality card ── */
.quality-card{border-left:4px solid var(--orange);background:var(--orange-bg);
  border-radius:var(--radius);padding:12px 14px;margin:4px 0 4px 36px;max-width:600px;font-size:12.5px;}
.quality-card b{display:block;margin-bottom:4px;}
.q-row{margin:2px 0;}
.q-crit{color:var(--red);}

/* ── Input bar ── */
.inputbar{flex-shrink:0;border-top:1px solid var(--border);padding:10px 20px 12px;background:var(--bg-s);}
.quick{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.q-btn{font-size:12px;padding:4px 11px;border-radius:14px;border:1px solid var(--border);
  background:var(--bg-s);color:var(--text-2);cursor:pointer;transition:all .15s;}
.q-btn:hover{border-color:var(--blue);color:var(--blue);}
.inrow{display:flex;gap:8px;}
textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:10px;
  padding:9px 14px;font-size:13.5px;background:var(--bg);color:var(--text);
  font-family:inherit;-webkit-user-select:text;user-select:text;line-height:1.5;}
textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.12);}
.send{padding:0 18px;border:none;border-radius:10px;background:var(--blue);color:#fff;
  font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap;}
.send:hover{opacity:.9;}
.disabled{opacity:.5;pointer-events:none;}
.hintbar{font-size:12px;color:var(--orange);margin-bottom:6px;display:none;}
.hintbar.show{display:block;}
.dragover textarea{border-color:var(--blue);border-style:dashed;}
</style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <div class="header">
    <button class="iconbtn" onclick="toggleSidebar()" title="切换侧栏">☰</button>
    <span class="logo"><span class="logo-icon">DA</span> DataAgent</span>
    <span class="chip"><span class="dot on" id="llmDot"></span> <span id="llmName">--</span></span>
    <span class="chip">RAM <span id="ramMb">--</span>MB</span>
    <span class="chip">Tok <span id="tokenUsed">0</span>/<span id="tokenLimit">64K</span></span>
    <button class="iconbtn" onclick="toggleTheme()" title="主题">◐</button>
    <button class="iconbtn" onclick="resetChat()" title="新对话">＋</button>
  </div>

  <!-- BODY -->
  <div class="body-wrap" id="bodyWrap">
    <aside class="sidebar" id="sidebar">
      <div class="sec">
        <div class="sec-h">会话 <span class="act" onclick="loadSessions()">刷新</span></div>
        <div id="sessionList"><div class="s-item" style="color:var(--text-3)">加载中…</div></div>
      </div>
      <div class="sec">
        <div class="sec-h">数据表 <span class="act" id="uploadLink">上传</span></div>
        <div id="tableList"><div class="s-item" style="color:var(--text-3)">暂无</div></div>
      </div>
      <div class="sec">
        <div class="sec-h">Skills</div>
        <div id="skillList"><div class="s-item" style="color:var(--text-3)">加载中…</div></div>
      </div>
      <div class="sec">
        <div class="sec-h">集团系</div>
        <div id="groupList"><div class="s-item" style="color:var(--text-3)">加载中…</div></div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <span class="title" id="chatTitle">新对话</span>
        <button class="new-btn" onclick="resetChat()">＋ 新对话</button>
      </div>
      <div class="chat" id="chat">
        <div class="welcome">
          <h2>DataAgent</h2>
          <p>上传资管数据文件，用中文提问即可分析</p>
          <p class="sub">合规/报告数字使用固化口径计算，需要您确认后输出</p>
        </div>
      </div>
      <div class="inputbar" id="inputbar">
        <div class="hintbar" id="hint">请先在上方完成确认或选择后再继续</div>
        <div class="quick">
          <button class="q-btn" onclick="sendQuick('/tables')">/tables</button>
          <button class="q-btn" onclick="sendQuick('/skills')">/skills</button>
          <button class="q-btn" onclick="sendQuick('/health')">/health</button>
          <button class="q-btn" onclick="resetChat()">清空对话</button>
        </div>
        <div class="inrow" id="inrow">
          <textarea id="input" rows="2"
            placeholder="输入分析需求… Enter 发送 / Shift+Enter 换行"
            onkeydown="onKey(event)"></textarea>
          <button class="send" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
        <input type="file" id="fileInput" style="display:none" accept=".csv,.xlsx,.xls"
          onchange="handleFiles(this.files)" multiple/>
      </div>
    </main>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
const ST={streamId:null,locked:false,sessionId:'',pendingCharts:[]};
let streamEl=null, streamBuf='';

// ═══════════════════════════════════════════════════════════
//  DOM helpers
// ═══════════════════════════════════════════════════════════
const $=id=>document.getElementById(id);
const chat=$('chat');
function scrollBottom(){chat.scrollTop=chat.scrollHeight;}
function add(node){chat.appendChild(node);scrollBottom();return node;}
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild||d;}

// ═══════════════════════════════════════════════════════════
//  API
// ═══════════════════════════════════════════════════════════
async function api(method,path,body){
  const opts={method,headers:{}};
  if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body);}
  const r=await fetch(path,opts);return r.json();
}

// ═══════════════════════════════════════════════════════════
//  Upload
// ═══════════════════════════════════════════════════════════
function handleFiles(files){for(const f of files)uploadFile(f);}
async function uploadFile(file){
  if(!file)return;
  const fd=new FormData();fd.append('file',file);fd.append('table_type',guessType(file.name));
  try{
    const r=await fetch('/api/upload',{method:'POST',body:fd});
    const d=await r.json();
    if(d.ok){
      addSysMsg(`已加载：<b>${esc(d.table_name)}</b>（${esc(file.name)}）`,'green');
      if(d.quality_report)renderQuality(d.quality_report,d.table_name);
      refreshSidebar();
    }else{addSysMsg(`上传失败：${esc(d.error)}`,'red');}
  }catch(e){addSysMsg(`上传异常：${e.message}`,'red');}
}
function guessType(fn){
  const n=fn.toLowerCase();
  if(n.includes('持仓')||n.includes('holding'))return'holding';
  if(n.includes('净值')||n.includes('nav'))return'nav';
  if(n.includes('评级')&&n.includes('主体'))return'rating_entity';
  if(n.includes('评级')&&n.includes('债券'))return'rating_bond';
  return'unknown';
}

// ═══════════════════════════════════════════════════════════
//  Sessions
// ═══════════════════════════════════════════════════════════
async function loadSessions(){
  try{
    const d=await api('GET','/api/sessions');
    const s=d.sessions||[];
    const list=$('sessionList');
    if(!s.length){list.innerHTML='<div class="s-item" style="color:var(--text-3)">暂无历史</div>';return;}
    list.innerHTML=s.slice(0,10).map(sess=>{
      const active=sess.id===ST.sessionId;
      return `<div class="s-item${active?' active':''}" onclick="loadSession('${sess.id}')">
        <span class="dot ${active?'on':'off'}"></span>
        <span class="s-text">${esc(sess.title||'未命名')}</span>
        <span class="s-meta">${(sess.updated_at||'').slice(5,16)}</span></div>`;
    }).join('');
  }catch(e){}
}
async function loadSession(id){
  try{
    const d=await api('GET',`/api/sessions/${id}`);
    clearChat();ST.sessionId=id;
    $('chatTitle').textContent=d.title||'历史会话';
    (d.messages||[]).forEach(m=>{
      if(m.role==='user')addUserBubble(m.content);
      else if(m.role==='assistant')addAgentHTML(m.content);
    });
    addSysMsg('历史会话回放完成，可继续对话','blue');
    refreshSidebar();
  }catch(e){addSysMsg(`加载失败：${e.message}`,'red');}
}

// ═══════════════════════════════════════════════════════════
//  SSE Send
// ═══════════════════════════════════════════════════════════
async function sendMessage(){
  const input=$('input');
  const msg=input.value.trim();
  if(!msg||ST.locked)return;
  input.value='';
  input.style.height='auto';

  // Remove welcome if present
  const w=chat.querySelector('.welcome');
  if(w)w.remove();

  addUserBubble(msg);
  $('chatTitle').textContent=msg.slice(0,40);

  try{
    const r=await fetch('/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg}),
    });
    const d=await r.json();
    if(!d.ok){addSysMsg(d.error||'请求失败','red');return;}
    ST.streamId=d.stream_id;

    const es=new EventSource(`/api/stream/${ST.streamId}`);
    es.onmessage=function(e){try{handleChunk(JSON.parse(e.data));}catch(ex){console.error(ex);}};
    es.onerror=function(){es.close();ST.streamId=null;endStream();};
  }catch(e){addSysMsg(`请求失败：${e.message}`,'red');}
}

// ═══════════════════════════════════════════════════════════
//  Chunk handler
// ═══════════════════════════════════════════════════════════
function handleChunk(chunk){
  const t=chunk.type, d=chunk.data;

  if(t==='text'){
    if(!d)return;
    if(!streamEl){
      streamBuf='';
      const row=document.createElement('div');
      row.className='msg-row';
      row.innerHTML='<div class="agent-avatar">DA</div><div class="bubble agent streaming"></div>';
      streamEl=row.querySelector('.bubble.agent');
      add(row);
    }
    streamBuf+=d;
    streamEl.innerHTML=renderMd(streamBuf);
    scrollBottom();
  }
  else if(t==='thinking'){
    breakStream();
    const g=document.createElement('div');
    g.className='proc-group';
    g.innerHTML=`<div class="proc-line"><span class="p-icon">💭</span>
      <span class="p-label">${esc(d)}</span></div>`;
    add(g);
  }
  else if(t==='tool_start'){
    breakStream();
    const g=document.createElement('div');
    g.className='proc-group';
    g.innerHTML=`<div class="proc-line" id="tool-${d.id}">
      <span class="p-icon">⚡</span>
      <span class="p-name">${esc(d.tool||'')}</span>
      <span class="p-label">${esc(d.label||'')}</span>
      <span class="p-st running">执行中…</span>
    </div><div class="proc-detail" id="detail-${d.id}"></div>`;
    g.querySelector('.proc-line').onclick=function(){this.classList.toggle('open');};
    add(g);
  }
  else if(t==='tool_end'){
    const line=$(`tool-${d.id}`);
    if(line){
      const st=line.querySelector('.p-st');
      if(d.success){st.className='p-st ok';st.textContent='✓ '+(d.summary||'完成');}
      else{st.className='p-st err';st.textContent='✗ '+(d.summary||'失败').slice(0,60);}
      if(d.sql){
        const det=$(`detail-${d.id}`);
        if(det)det.innerHTML=`<pre>${esc(d.sql)}</pre>`;
      }
    }
  }
  else if(t==='table'){
    breakStream();
    add(renderTable(d));
  }
  else if(t==='confirm'){
    breakStream();
    ST.locked=true;lockInput(true);
    add(renderConfirm(d));
  }
  else if(t==='ask'){
    breakStream();
    ST.locked=true;lockInput(true);
    add(renderAsk(d));
  }
  else if(t==='error'){
    breakStream();
    addSysMsg(esc(d.message||d),'red');
  }
  else if(t==='chart'){
    ST.pendingCharts.push(d);
  }
  else if(t==='stream_end'){
    endStream();
    refreshSidebar();
    ST.pendingCharts.forEach(opt=>renderChart(opt));
    ST.pendingCharts=[];
  }
}

function breakStream(){
  if(streamEl){streamEl.classList.remove('streaming');}
  streamEl=null;
}
function endStream(){
  breakStream();streamBuf='';ST.streamId=null;
}

// ═══════════════════════════════════════════════════════════
//  Markdown renderer (lightweight, ~80 lines)
// ═══════════════════════════════════════════════════════════
function renderMd(raw){
  if(!raw)return'';
  const lines=raw.split('\n');
  let html='',inCode=false,codeLang='',code=[];
  let inList=false,listTag='';
  let inTable=false,tableRows=[];

  for(let i=0;i<lines.length;i++){
    const L=lines[i];

    // Code fence
    if(L.startsWith('```')){
      if(inCode){
        html+=`<pre><code>${esc(code.join('\n'))}</code></pre>`;
        inCode=false;code=[];codeLang='';
      }else{
        closeList();closeTable();
        inCode=true;codeLang=L.slice(3).trim();
      }
      continue;
    }
    if(inCode){code.push(L);continue;}

    // Table row
    if(L.match(/^\|.*\|$/)){
      closeList();
      if(!inTable){inTable=true;tableRows=[];}
      tableRows.push(L);continue;
    }
    if(inTable){closeTable();}

    // Empty line
    if(!L.trim()){closeList();html+='<br>';continue;}

    // Headings
    if(L.startsWith('### ')){closeList();html+=`<h4>${inline(L.slice(4))}</h4>`;continue;}
    if(L.startsWith('## ')){closeList();html+=`<h4>${inline(L.slice(3))}</h4>`;continue;}
    if(L.startsWith('# ')){closeList();html+=`<h3>${inline(L.slice(2))}</h3>`;continue;}

    // Blockquote
    if(L.startsWith('> ')){closeList();html+=`<blockquote>${inline(L.slice(2))}</blockquote>`;continue;}

    // Unordered list
    const ul=L.match(/^\s*[-*]\s+(.*)/);
    if(ul){
      if(!inList||listTag!=='ul'){closeList();html+='<ul>';inList=true;listTag='ul';}
      html+=`<li>${inline(ul[1])}</li>`;continue;
    }
    // Ordered list
    const ol=L.match(/^\s*\d+\.\s+(.*)/);
    if(ol){
      if(!inList||listTag!=='ol'){closeList();html+='<ol>';inList=true;listTag='ol';}
      html+=`<li>${inline(ol[1])}</li>`;continue;
    }

    closeList();
    html+=`<p>${inline(L)}</p>`;
  }

  // Flush
  if(inCode)html+=`<pre><code>${esc(code.join('\n'))}</code></pre>`;
  closeList();closeTable();
  return html;

  function closeList(){if(inList){html+=listTag==='ul'?'</ul>':'</ol>';inList=false;}}
  function closeTable(){
    if(!inTable)return;inTable=false;
    if(tableRows.length<2){tableRows.forEach(r=>{html+=`<p>${inline(r)}</p>`;});tableRows=[];return;}
    const hdr=tableRows[0].split('|').filter(c=>c.trim());
    let t='<div class="md-table-wrap"><table class="md-table"><thead><tr>';
    hdr.forEach(c=>{t+=`<th>${inline(c.trim())}</th>`;});
    t+='</tr></thead><tbody>';
    for(let j=2;j<tableRows.length;j++){
      const cells=tableRows[j].split('|').filter(c=>c.trim());
      t+='<tr>';cells.forEach(c=>{t+=`<td>${inline(c.trim())}</td>`;});t+='</tr>';
    }
    t+='</tbody></table></div>';html+=t;tableRows=[];
  }
}

function inline(text){
  let s=esc(text);
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s=s.replace(/`(.+?)`/g,'<code>$1</code>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  return s;
}

//  Render functions
// ═══════════════════════════════════════════════════════════
function addUserBubble(text){
  add(el(`<div class="msg-row user"><div class="bubble user">${esc(text)}</div></div>`));
}

function addAgentHTML(html){
  add(el(`<div class="msg-row"><div class="agent-avatar">DA</div><div class="bubble agent">${html}</div></div>`));
}

function addSysMsg(html,color){
  const c=color==='red'?'var(--red)':color==='green'?'var(--green)':'var(--blue)';
  add(el(`<div class="msg-row"><div class="agent-avatar">DA</div>
    <div class="bubble agent" style="border-left:3px solid ${c};font-size:13px;">${html}</div></div>`));
}

function renderTable(d){
  const cols=d.columns||[],rows=d.rows||[];
  let h=`<div class="table-card"><div class="tc-head">
    <span class="tc-title">${esc(d.title||'查询结果')}</span>
    <span class="tc-meta">${rows.length} 行</span></div>
    <div class="dt-wrap"><table class="dt">
    <thead><tr>${cols.map((c,i)=>`<th onclick="sortTbl(this,${i})">${esc(c)}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(r=>{
    h+='<tr>';
    r.forEach(v=>{
      const isNum=typeof v==='number'||(typeof v==='string'&&v!==''&&!isNaN(Number(v)));
      h+=`<td${isNum?' class="num"':''}>${isNum?Number(v).toLocaleString():esc(String(v??''))}</td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div><div class="tc-actions">';
  if(d.sql)h+=`<span class="tc-link" onclick="toggleSql(this)">查看 SQL</span><pre style="display:none;margin-top:4px;font-size:12px;background:var(--bg-code);padding:6px 8px;border-radius:4px">${esc(d.sql)}</pre>`;
  h+=`<span class="tc-link" onclick="exportCSV(this)">导出 CSV</span></div></div>`;
  return el(h);
}

function toggleSql(el){const pre=el.nextElementSibling;if(pre)pre.style.display=pre.style.display==='none'?'block':'none';}

function renderConfirm(d){
  let tbl='';
  const summary=d.summary||[];
  if(summary.length){
    tbl='<table class="summary-table">';
    summary.forEach(s=>{tbl+=`<tr><td>${esc(s.label||'')}</td><td>${esc(String(s.value??''))}</td></tr>`;});
    tbl+='</table>';
  }
  let formula='';
  if(d.sql_or_formula)formula=`<div style="margin:8px 0"><span class="tc-link" onclick="toggleSql(this)">查看公式/SQL</span>
    <pre style="display:none;margin-top:4px;font-size:12px">${esc(d.sql_or_formula)}</pre></div>`;
  return el(`<div class="action-card">
    <h3>${esc(d.title||'请确认')}</h3>
    <div class="sub">请确认以上数值与口径是否正确</div>${tbl}${formula}
    <button class="btn primary" onclick="doConfirm(true)">确认，继续</button>
    <button class="btn ghost" style="margin-left:8px" onclick="doConfirm(false)">取消</button>
  </div>`);
}

function renderAsk(d){
  const opts=(d.options||[]).map(o=>`<button class="btn opt" onclick="doAsk('${esc(o)}')">${esc(o)}</button>`).join('');
  return el(`<div class="action-card">
    <h3>${esc(d.question||'请选择')}</h3>
    <div class="sub">为保证数字正确，请选择一个选项</div>${opts}
  </div>`);
}

function renderQuality(qr,name){
  const crit=qr.critical_issues||[],warns=qr.warnings||[];
  let h=`<div class="quality-card"><b>数据质量 · ${esc(name)}</b>`;
  if(crit.length){
    h+=`<div style="color:var(--red);margin-top:4px">需要注意（${crit.length}项）</div>`;
    crit.forEach(c=>{h+=`<div class="q-row q-crit">• ${esc(c)}</div>`;});
  }
  if(warns.length)warns.slice(0,5).forEach(w=>{h+=`<div class="q-row" style="color:var(--text-2)">• ${esc(w)}</div>`;});
  if(!crit.length&&!warns.length)h+=`<div style="color:var(--green);margin-top:4px">数据质量正常</div>`;
  h+='</div>';
  add(el(h));
}

function renderChart(opt){
  if(typeof echarts==='undefined'){console.warn('ECharts not loaded');return;}
  const id='ch_'+Math.random().toString(36).slice(2,8);
  const card=add(el(`<div class="table-card">
    <div class="tc-head"><span class="tc-title">${esc(opt.title||'图表')}</span></div>
    <div id="${id}" style="width:100%;height:350px"></div></div>`));
  requestAnimationFrame(()=>{
    const dom=$(id);
    if(dom){try{echarts.init(dom).setOption(opt.option);}catch(e){console.error(e);}}
  });
}

// ═══════════════════════════════════════════════════════════
//  Actions
// ═══════════════════════════════════════════════════════════
async function doConfirm(confirmed){
  ST.locked=false;lockInput(false);
  await api('POST','/api/confirm',{confirmed});
  if(!confirmed){addSysMsg('已取消本次操作。','orange');}
  else{$('input').value='确认继续';sendMessage();}
}

function doAsk(choice){
  ST.locked=false;lockInput(false);
  $('input').value=choice;sendMessage();
}

function sendQuick(cmd){$('input').value=cmd;sendMessage();}

function lockInput(lock){
  $('inrow').classList.toggle('disabled',lock);
  $('hint').classList.toggle('show',lock);
}

function sortTbl(th,col){
  const tbody=th.closest('table').querySelector('tbody');
  const rows=Array.from(tbody.querySelectorAll('tr'));
  const asc=th.dataset.sort!=='asc';
  rows.sort((a,b)=>{
    const va=a.children[col]?.textContent||'',vb=b.children[col]?.textContent||'';
    const na=parseFloat(va.replace(/,/g,'')),nb=parseFloat(vb.replace(/,/g,''));
    if(!isNaN(na)&&!isNaN(nb))return asc?na-nb:nb-na;
    return asc?va.localeCompare(vb):vb.localeCompare(va);
  });
  th.dataset.sort=asc?'asc':'desc';
  rows.forEach(r=>tbody.appendChild(r));
}

function exportCSV(btn){
  const card=btn.closest('.table-card');
  const table=card?.querySelector('table');
  if(!table)return;
  let csv='';
  table.querySelectorAll('tr').forEach(r=>{
    const cells=[];
    r.querySelectorAll('th,td').forEach(c=>cells.push('"'+c.textContent.replace(/"/g,'""')+'"'));
    csv+=cells.join(',')+'\n';
  });
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='export_'+Date.now()+'.csv';a.click();
}

async function loadTables(){
  try{
    const d=await api('GET','/api/tables');
    const tables=d.tables||[];
    const list=$('tableList');
    if(!tables.length){list.innerHTML='<div class="s-item" style="color:var(--text-3)">暂无数据</div>';return;}
    list.innerHTML=tables.map(t=>{
      const color=t.type==='holding'?'var(--green)':t.type==='nav'?'var(--blue)':'var(--text-3)';
      return `<div class="s-item"><span class="dot" style="background:${color}"></span>
        <span class="s-text">${esc(t.name)}</span><span class="s-meta">${t.rows}行</span></div>`;
    }).join('');
  }catch(e){}
}
async function loadSkills(){
  try{
    const d=await api('GET','/api/skills');
    const list=$('skillList');
    const skills=d.skills||[];
    if(!skills.length){list.innerHTML='<div class="s-item" style="color:var(--text-3)">无可用技能</div>';return;}
    list.innerHTML=skills.map(s=>
      `<div class="s-item"><span class="s-text">${esc(s.name)}</span>
       <span class="s-tag ${s.calc_type==='fixed'?'fixed':'exp'}">${s.calc_type==='fixed'?'固化':'探索'}</span></div>`
    ).join('');
  }catch(e){}
}
async function loadGroups(){
  try{
    const r=await fetch('/api/groups');if(!r.ok)return;
    const d=await r.json();const groups=d.groups||{};
    const list=$('groupList');
    const entries=Object.entries(groups);
    if(!entries.length){list.innerHTML='<div class="s-item" style="color:var(--text-3)">暂无</div>';return;}
    list.innerHTML=entries.map(([k,v])=>
      `<div class="s-item"><span class="s-text">${esc(k)}</span><span class="s-meta">${v.length}主体</span></div>`
    ).join('');
  }catch(e){}
}

function esc(s){
  if(s===null||s===undefined)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
