# 主体别名/归一表
# 解决：不同系统导出的同一主体写法不一致，导致 JOIN 静默错配
# 格式：标准名称（canonical） + 已知别名列表（aliases）

# 使用说明：
# 1. 加载数据后，自动对「限额占用主体」字段应用此表进行归一
# 2. JOIN 前基于归一后的名称进行匹配
# 3. 遇到无法归一的名称，系统提示用户确认而非静默匹配

entities:
  - canonical: "象屿集团"
    aliases:
      - "厦门象屿集团有限公司"
      - "象屿集团有限公司"
      - "厦门象屿"
      - "象屿"
    group: "象屿系"

  - canonical: "象屿股份"
    aliases:
      - "厦门象屿股份有限公司"
    group: "象屿系"

  - canonical: "建发集团"
    aliases:
      - "厦门建发集团有限公司"
      - "建发集团有限公司"
    group: "建发系"

# ── 说明 ────────────────────────────────────────────────
# 本文件由管理员维护，发现新的别名写法时添加即可
# 无需修改任何代码
# 集团系归属（group 字段）与 groups.yaml 中的定义保持一致
