# DataAgent 配置文件 v1.3

# ── LLM 配置 ──────────────────────────────────────────────
# ★ 测试阶段：统一使用 DeepSeek（内网 LLM 不可用时临时配置）★
llm:
  sql_gen:                             # SQL生成 / 意图分类 / Tool-calling
    primary: lmstudio                  # ★本地测试：使用 LM Studio（改为 deepseek 或 enterprise_internal 切换）
    fallback: deepseek
    external_allowed: true             # ★测试：允许外发
    tool_mode: native                  # native = OpenAI function-calling（默认）
                                       # react  = 文本 JSON 协议（仅作兜底，可后置）
    timeout: 60                        # 本地模型推理较慢，放宽超时
    max_tokens: 2000

  report_text:                         # 报告文字生成
    provider: deepseek                 # ★测试：临时用 DeepSeek（生产须改回 enterprise）
    url: https://api.deepseek.com/v1
    model: deepseek-chat
    api_key: 你的DeepSeek_API_Key
    timeout: 60
    max_tokens: 3000
    fallback: none                     # ★ 显式禁止 fallback，内网挂了降级模板

  enterprise_internal:
    url: http://127.0.0.1:8081/v1       # 网关代理地址（gateway.enabled=true 时自动启动）
    model: [企业模型名称]               # 企业 LLM 模型名称
    api_key: ""                         # 留空：代理统一鉴权，DataAgent 不发 Bearer Token
    auth_type: none                     # none=不发 Authorization 头（代理已配置 APP_CODE 时用此值）
                                        # bearer=发送 Bearer {api_key}（默认，适用于 DeepSeek/LMStudio）
    gateway:                            # 企业网关代理配置（可选，仅企业内网环境需要）
      enabled: false                    # true=启动时自动运行网关代理
      proxy_port: 8081                  # 代理监听端口（与上面 url 端口一致）
      gateway_url: http://[企业网关地址]:8080  # 企业内网网关实际地址

  deepseek:
    url: https://api.deepseek.com/v1
    model: deepseek-chat
    api_key: 你的DeepSeek_API_Key

  lmstudio:                            # ★ 本地 LLM（LM Studio）
    url: http://localhost:1234/v1       # LM Studio 默认端口
    model: qwen/qwen3-8b               # 当前测试模型（在 LM Studio 中加载）
    api_key: lm-studio                 # 占位符（LM Studio 不校验 key）
    timeout: 120                       # 本地推理耗时较长，超时设宽
    # ★ 使用说明：
    # 1. 下载 LM Studio: https://lmstudio.ai
    # 2. 搜索并下载 qwen/qwen3-8b 模型
    # 3. 点击 "Local Server" → Start Server（默认端口 1234）
    # 4. 本文件 sql_gen.primary 已设为 lmstudio，直接 python main.py 即可

# ── 固化计算口径配置（C-01确认后修改此处）──────────────────
# 注意：修改此处会影响所有合规计算结果，修改前须经合规确认
calculation_config:
  concentration:
    market_value_field: "穿透后市值"   # C-01待确认：全穿透/半穿透
    use_group_merge: true              # true=集团合并口径（监管常用）
    exclude_asset_types: []            # 排除的资产大类（如需排除现金）
    threshold_entity: 10.0             # 主体集中度阈值(%)
    threshold_single_bond: 10.0        # 单券集中度阈值(%)
    data_max_age_days: 1               # 数据最大允许滞后天数（超过则停止计算）
  nav:
    return_annualization_days: 365

# ── 当前用户档案 ───────────────────────────────────────────
user_profile:
  name: ""                             # 当前用户姓名，如「张三」
  department: ""                       # 所在部门，如「固收投资部」
  role: ""                             # 投资经理 / 研究员 / 部门负责人 / 合规
  managed_products:                    # 该用户管理的理财产品（名称与数据表一致）
    - ""

# ── 应用设置 ───────────────────────────────────────────────
app:
  window_title: DataAgent
  window_width: 1280
  window_height: 800
  debug: false
  max_agent_turns: 15
  max_tool_retry: 3
  context_budget_ratio: 0.75
  work_dir: ""
  auto_load:
    enabled: false
    max_versions: 3
    file_rules:
      - pattern: "持仓产品管理-*.xls"
        table_type: holding
        sheet_mode: merge_all
      - pattern: "底层资产持仓及债券信息表*.xlsx"
        table_type: holding_detail
      - pattern: "估值表查询(*.xlsx"
        table_type: valuation
        sheet_select: first
      - pattern: "监控值查询*.xlsx"
        table_type: monitoring
      - pattern: "净值结果管理*.xlsx"
        table_type: nav
      - pattern: "评级结果[0-9]*.xls"
        table_type: rating_entity
      - pattern: "申赎数据*.xlsx"
        table_type: subscription
        sheet_select: first
      - pattern: "实时资产头寸查询(*.xlsx"
        table_type: asset_position
      - pattern: "投资债券评级结果*.xls"
        table_type: rating_bond
        sheet_mode: merge_all
      - pattern: "现金流缺口分析(*.xlsx"
        table_type: cashflow_gap
      - pattern: "债券质押查询(*.xlsx"
        table_type: bond_pledge
        sheet_select: first
      - pattern: "账户流水(*.xlsx"
        table_type: account_flow
      - pattern: "质押式回购投资交易查询(*.xlsx"
        table_type: repo_trade
      - pattern: "组合资金账户头寸(*.xlsx"
        table_type: fund_position

# ── Skills 目录 ────────────────────────────────────────────
skills:
  local_dir: skills/
  shared_dir: ""

# ── 数据引擎 ───────────────────────────────────────────────
duckdb:
  max_memory: "300MB"
  threads: 2
  db_path: "data/dataagent.duckdb"

# ── 定时任务 ───────────────────────────────────────────────
scheduler:
  enabled: true
  task_config: tasks/task_config.yaml

# ── 跨会话记忆（R5）────────────────────────────────────
memory:
  enabled: false                      # 默认关闭；用户在 UI 开启
  max_db_mb: 5                        # 体积告警阈值

# ── 远程数据源 ─────────────────────────────────────────────
data_sources:
  remote_databases:                      # 远程数据库连接配置
    # - name: "投研数据库"
    #   db_type: postgresql               # mysql / postgresql / sqlite / sqlserver / oracle
    #   host: 192.168.1.100
    #   port: 5432
    #   database: research_db
    #   username: readonly_user
    #   password: "base64:xxxxx"          # base64 编码存储
    #   default_schema: public
    #   read_only: true                   # 强制只读
  vendor_apis:                           # 金融资讯 API（P2 阶段）
    choice:
      enabled: false                     # Choice (EmQuantAPI)
    ifind:
      enabled: false                     # iFinD (iFinDPy)
      username: ""
      password: ""
    wind:
      enabled: false                     # Wind (WindPy) — 预留

# ── 内测脱敏防控 ──────────────────────────────────────────
masking:
  enabled: true                        # 默认开启，内测阶段防止敏感数据泄露
  fields: ""                           # 需要脱敏的字段名，逗号分隔
                                       # 如："限额占用方主体,发行人名称,产品名称"

# ── 运行日志 ───────────────────────────────────────────────
logging:
  mode: basic                         # basic=仅错误和关键事件 | detailed=全量记录
  max_days: 30                        # 日志保留天数，超期自动清理
