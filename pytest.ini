[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=agent
    --cov=tools
    --cov=calculators
    --cov=platform_adapter
    --cov-report=term-missing
    --cov-report=html:data/test_reports/coverage_html
    --cov-report=json:data/test_reports/coverage.json
    --junitxml=data/test_reports/junit.xml
markers =
    unit: Pure unit tests, no external dependencies
    integration: Tests requiring multiple modules working together
    calculator: Fixed calculation module tests (compliance critical)
    sqlguard: SQL security guard tests
    agent: Agent loop and tool-calling tests
    data_loader: Data loading and encoding tests
    profiler: Table profiling tests
    quality: Data quality diagnostic tests
    memory: Cross-session memory tests
    platform: Platform adapter tests
    slow: Tests that take >5 seconds
    smoke: Quick sanity checks for CI gating
